name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: careerlens
          POSTGRES_PASSWORD: careerlens
          POSTGRES_DB: careerlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerlens -d careerlens_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://careerlens:careerlens@localhost:5432/careerlens_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check installed dependencies
        run: python -m pip check

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Check migration consistency
        run: python -m alembic check

      - name: Run tests
        run: python -m pytest backend/tests -q

      - name: Run PostgreSQL integration test
        env:
          RUN_POSTGRES_TESTS: "1"
        run: python -m pytest backend/tests/test_postgres_integration.py -q

      - name: Run browser tests
        env:
          E2E_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: python -m pytest e2e --browser chromium --tracing=retain-on-failure -q

      - name: Upload browser traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: browser-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check Python compilation
        run: python -m compileall -q backend e2e

      - name: Check frontend JavaScript
        run: node --check frontend/script.js

      - name: Validate deployment configuration
        env:
          POSTGRES_PASSWORD: ci-database-password
          AUTH_SECRET_KEY: ci-auth-secret-that-is-at-least-32-characters
        run: docker compose config --quiet

      - name: Build production image
        run: docker build --tag careerlens:ci .

      - name: Check production image imports
        run: >-
          docker run --rm careerlens:ci python -c
          "from backend.app.main import app; assert app.title == 'CareerLens'"
