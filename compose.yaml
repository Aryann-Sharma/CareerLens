name: careerlens

x-app-environment: &app-environment
  ENVIRONMENT: development
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-careerlens}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@database:5432/${POSTGRES_DB:-careerlens}
  AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY in .env.docker}
  AUTH_TOKEN_EXPIRE_MINUTES: ${AUTH_TOKEN_EXPIRE_MINUTES:-60}

services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careerlens}
      POSTGRES_USER: ${POSTGRES_USER:-careerlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql

  migrate:
    build: .
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: *app-environment
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  postgres_data:
